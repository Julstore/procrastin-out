<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>procrastin-out</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0D251C; }
  body { position: relative; }
  .halo { position: absolute; pointer-events: none; border-radius: 50%; background: rgba(230,126,34,.18); filter: blur(56px); }
  .halo.tl { width: min(42vw, 520px); aspect-ratio: 1; top: -20vh; left: -14vw; }
  .halo.br { width: min(44vw, 560px); aspect-ratio: 1; right: -16vw; bottom: -24vh; }
  .halo.center { width: min(72vw, 700px); height: min(52vh, 500px); top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(230,126,34,.12); }
  .art { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.8vh, 16px); padding: 24px; }
  .mark, .label { display: block; height: auto; object-fit: contain; image-rendering: auto; }
  .mark { width: min(54vw, 34vh, 430px); max-height: 38vh; }
  .label { width: min(66vw, 38vh, 480px); max-height: 12vh; }
  @media (max-width: 600px) {
    .art { gap: clamp(8px, 1.5vh, 12px); padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom)); }
    .mark { width: min(72vw, 32vh, 340px); max-height: 34vh; }
    .label { width: min(76vw, 34vh, 360px); max-height: 10vh; }
    .halo { filter: blur(40px); }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
  <div class="halo tl"></div>
  <div class="halo br"></div>
  <div class="halo center"></div>
  <main class="art" aria-label="procrastin-out">
    <img class="mark" src="mark-real.png?v=3" width="1080" height="804" fetchpriority="high" decoding="async" alt="">
    <img class="label" src="label-real.png?v=3" width="1200" height="102" fetchpriority="high" decoding="async" alt="">
  </main>
</body>
</html>
