  #poutSplash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #0D251C; }

  @keyframes poutSplashIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @media (max-width: 600px) {

  <script>
    // El splash se retira cuando la app terminó de pintar (app.js llama a poutSplashDone).
    // La red de seguridad evita que se quede pegado si el servidor tarda en despertar.
    (function () {
      var el = document.getElementById('poutSplash');
      if (!el) return;
      var off = false;
      window.poutSplashDone = function () {
        if (off) return;
        off = true;
        el.classList.add('off');
        setTimeout(function () { el.remove(); }, 400);
      };
      setTimeout(window.poutSplashDone, 6000);
    })();
  </script>
