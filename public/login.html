<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>procrastin-out — entrar</title>
<meta name="theme-color" content="#0D251C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>  :root { color-scheme: dark; --bg:#0D251C; --bg-2:#163A2B; --card:rgba(13,37,28,.80); --ink:#FFFFFF; --muted:#9DB8AA; --accent:#2E9D68; --accent-hot:#4CC587; --accent-2:#E67E22; --danger:#ff6f66; --line:rgba(255,255,255,.12); }
body { font-family:"Manrope","Segoe UI",system-ui,sans-serif; color:var(--ink); display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; padding:18px; background:
  radial-gradient(760px 420px at 18% 6%, rgba(230,126,34,.25), transparent 62%),
  radial-gradient(680px 420px at 84% 94%, rgba(230,126,34,.25), transparent 60%),
  linear-gradient(180deg, var(--bg), var(--bg-2)); background-attachment: fixed; }
.box { position:relative; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px 28px; width:100%; max-width:360px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.45); backdrop-filter: blur(18px) saturate(1.2); overflow:hidden; }
.box::before { content:""; position:absolute; inset:0 0 auto 0; height:6px; background:linear-gradient(90deg,var(--accent),var(--accent-2),#1e9e57); }
.mark { width:118px; height:118px; margin:4px auto 12px; }
.mark img { width:100%; height:100%; display:block; filter: drop-shadow(0 10px 16px rgba(8,30,18,.35)); }
h1 { font-family:\"Unbounded\",\"Manrope\",sans-serif; font-size:23px; font-weight:800; margin:0; letter-spacing:-.01em; text-transform:lowercase; }
p.sub { color:var(--muted); font-size:13px; margin:6px 0 18px; }
input { width:100%; background:rgba(255,255,255,.08); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:12px; font-size:17px; margin-bottom:9px; text-align:center; letter-spacing:3px; box-sizing:border-box; }
input:focus { outline:none; border-color:var(--accent-hot); box-shadow:0 0 0 4px rgba(76,197,135,.18); }
button { width:100%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border:1px solid rgba(255,255,255,.22); border-radius:12px; padding:12px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 12px 24px rgba(230,126,34,.28); }
button:hover { filter:brightness(1.05); transform:translateY(-1px); }
.err { color:var(--danger); font-size:13px; min-height:20px; margin:10px 0; font-weight:700; }
.err.shake { animation: shake .28s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
a { color:var(--muted); font-size:13px; }
/* Splash de marca: el mismo arte real que la app, surgiendo desde el centro. */
#poutSplash { position:fixed; inset:0; z-index:9999; overflow:hidden; background:#0D251C url('splash-bg.png?v=2') center/100% 100% no-repeat; }
#poutSplash .art { position:absolute; inset:0; animation:poutSplashIn .9s cubic-bezier(.22,.9,.28,1) both; }
#poutSplash .mk { position:absolute; left:53.8%; top:41.4%; width:69.8%; height:auto; transform:translate(-50%,-50%); }
#poutSplash .lb { position:absolute; left:49.8%; top:59.7%; width:83%; height:auto; transform:translate(-50%,-50%); }
#poutSplash.off { opacity:0; transition:opacity .35s ease; pointer-events:none; }
@keyframes poutSplashIn { from { opacity:0; transform:scale(.86); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { #poutSplash .art { animation:none; } }
</style>
</head>
<body>
<div id="poutSplash" aria-hidden="true">
  <div class="art">
    <img class="mk" src="mark-real.png?v=2" alt="" width="239" height="178">
    <img class="lb" src="label-real.png?v=2" alt="" width="246" height="21">
  </div>
</div>
<div class="box">
  <div class="mark"><img src="icon-192.png?v=2" alt="procrastin-out"></div>
  <h1>procrastin-out</h1>
  <p class="sub" id="sub">Comprobando...</p>
  <div id="form"></div>
  <p class="err" id="err"></p>
  <p><a href="/" id="back" hidden>← Volver a la app</a></p>
</div>
<script>
const $ = s => document.querySelector(s);
async function api(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('Error '+r.status));
  return j;
}
function pinField(id, ph){ return `<input type="password" id="${id}" placeholder="${ph}" autocomplete="off" maxlength="64">`; }
function err(m){ const e=$('#err'); e.textContent = m; e.classList.remove('shake'); void e.offsetWidth; if(m) e.classList.add('shake'); }
async function init(){
  let st;
  try { st = await fetch('/api/auth/status').then(r=>r.json()); }
  catch(e){ $('#sub').textContent = 'No se pudo contactar al servidor.'; return; }
  if (!st.setup) {
    $('#sub').textContent = 'Crea tu PIN para proteger tus datos (mínimo 4 caracteres).';
    $('#form').innerHTML = pinField('p1','Elige tu PIN') + pinField('p2','Repite tu PIN') + '<button id="go">Crear PIN y entrar</button>';
    $('#go').onclick = async () => {
      const a=$('#p1').value, b=$('#p2').value;
      if (a.length<4) return err('Mínimo 4 caracteres.');
      if (a!==b) return err('Los PIN no coinciden.');
      try { await api('/api/auth/setup',{pin:a}); location.href='/'; } catch(e){ err(e.message); }
    };
    $('#p1').focus();
  } else if (!st.unlocked) {
    $('#sub').textContent = 'Introduce tu PIN para entrar.';
    $('#form').innerHTML = pinField('p','Tu PIN') + '<button id="go">Entrar</button>';
    const go = async () => { try { await api('/api/auth/login',{pin:$('#p').value}); location.href='/'; } catch(e){ err(e.message); } };
    $('#go').onclick = go;
    $('#p').onkeydown = e => { if(e.key==='Enter') go(); };
    $('#p').focus();
  } else {
    $('#sub').textContent = 'Sesión iniciada. Puedes cambiar tu PIN.';
    $('#back').hidden = false;
    $('#form').innerHTML = pinField('c','PIN actual') + pinField('p1','PIN nuevo') + pinField('p2','Repite el PIN nuevo') + '<button id="go">Cambiar PIN</button>';
    $('#go').onclick = async () => {
      const a=$('#p1').value, b=$('#p2').value;
      if (a.length<4) return err('Mínimo 4 caracteres.');
      if (a!==b) return err('Los PIN no coinciden.');
      try { await api('/api/auth/change',{current:$('#c').value, pin:a}); $('#err').style.color='var(--accent)'; err('PIN cambiado ✓'); }
      catch(e){ err(e.message); }
    };
  }
}
(function () {
  var el = document.getElementById('poutSplash');
  if (!el) return;
  var off = false;
  window.poutSplashDone = function () {
    if (off) return;
    off = true;
    el.classList.add('off');
    setTimeout(function () { el.remove(); }, 400);
  };
  setTimeout(window.poutSplashDone, 6000);
})();
// el formulario aparece cuando init() terminó; el splash se retira un instante después, para que se vea surgir
init().then(function () { setTimeout(window.poutSplashDone, 900); }, function () { window.poutSplashDone(); });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {}));
}
</script>
</body>
</html>
