<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>procrastin-out — entrar</title>
<meta name="theme-color" content="#e2482e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: light dark; --bg:#f3eee3; --card:rgba(255,253,247,.86); --ink:#221c12; --muted:#7b7160; --accent:#ff4b26; --accent-2:#d99a12; --danger:#d2342c; --line:rgba(34,28,18,.14); }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d0f18; --card:rgba(20,24,38,.78); --ink:#f4f1e8; --muted:#9c96a5; --accent:#ff5b36; --accent-2:#f5c044; --danger:#ff6f66; --line:rgba(244,241,232,.14); }
}
body { font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; color:var(--ink); display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; padding:18px; background: radial-gradient(760px 420px at 18% 8%, rgba(255,91,54,.24), transparent 62%), radial-gradient(680px 420px at 84% 18%, rgba(245,189,47,.20), transparent 60%), linear-gradient(180deg, var(--bg), rgba(0,0,0,.06)); background-attachment: fixed; }
.box { position:relative; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px 28px; width:100%; max-width:360px; text-align:center; box-shadow:0 24px 60px rgba(46,28,8,.18); backdrop-filter: blur(18px) saturate(1.2); overflow:hidden; }
.box::before { content:""; position:absolute; inset:0 0 auto 0; height:6px; background:linear-gradient(90deg,var(--accent),var(--accent-2),#1e9e57); }
.mark { width:58px; height:58px; margin:0 auto 10px; display:grid; place-items:center; font-size:30px; color:#fff; border-radius:20px; background:linear-gradient(135deg,#ff3d1e,#ff7a3d 52%,#f5bd2f); box-shadow:0 12px 24px rgba(255,77,46,.35), inset 0 1px 0 rgba(255,255,255,.45); }
h1 { font-size:27px; margin:0; letter-spacing:.01em; text-transform:lowercase; }
p.sub { color:var(--muted); font-size:13px; margin:6px 0 18px; }
input { width:100%; background:rgba(255,255,255,.55); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:12px; font-size:17px; margin-bottom:9px; text-align:center; letter-spacing:3px; box-sizing:border-box; }
input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,91,54,.18); }
button { width:100%; background:linear-gradient(135deg,var(--accent),#ff7a3d); color:#fff; border:1px solid rgba(255,255,255,.22); border-radius:12px; padding:12px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 12px 24px rgba(255,77,46,.30); }
button:hover { filter:brightness(1.05); transform:translateY(-1px); }
.err { color:var(--danger); font-size:13px; min-height:20px; margin:10px 0; font-weight:700; }
.err.shake { animation: shake .28s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
a { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="box">
  <div class="mark" aria-hidden="true">🥊</div>
  <h1>procrastin-out</h1>
  <p class="sub" id="sub">Comprobando...</p>
  <div id="form"></div>
  <p class="err" id="err"></p>
  <p><a href="/" id="back" hidden>← Volver a la app</a></p>
</div>
<script>
const $ = s => document.querySelector(s);
async function api(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('Error '+r.status));
  return j;
}
function pinField(id, ph){ return `<input type="password" id="${id}" placeholder="${ph}" autocomplete="off" maxlength="64">`; }
function err(m){ const e=$('#err'); e.textContent = m; e.classList.remove('shake'); void e.offsetWidth; if(m) e.classList.add('shake'); }
async function init(){
  let st;
  try { st = await fetch('/api/auth/status').then(r=>r.json()); }
  catch(e){ $('#sub').textContent = 'No se pudo contactar al servidor.'; return; }
  if (!st.setup) {
    $('#sub').textContent = 'Crea tu PIN para proteger tus datos (mínimo 4 caracteres).';
    $('#form').innerHTML = pinField('p1','Elige tu PIN') + pinField('p2','Repite tu PIN') + '<button id="go">Crear PIN y entrar</button>';
    $('#go').onclick = async () => {
      const a=$('#p1').value, b=$('#p2').value;
      if (a.length<4) return err('Mínimo 4 caracteres.');
      if (a!==b) return err('Los PIN no coinciden.');
      try { await api('/api/auth/setup',{pin:a}); location.href='/'; } catch(e){ err(e.message); }
    };
    $('#p1').focus();
  } else if (!st.unlocked) {
    $('#sub').textContent = 'Introduce tu PIN para entrar.';
    $('#form').innerHTML = pinField('p','Tu PIN') + '<button id="go">Entrar</button>';
    const go = async () => { try { await api('/api/auth/login',{pin:$('#p').value}); location.href='/'; } catch(e){ err(e.message); } };
    $('#go').onclick = go;
    $('#p').onkeydown = e => { if(e.key==='Enter') go(); };
    $('#p').focus();
  } else {
    $('#sub').textContent = 'Sesión iniciada. Puedes cambiar tu PIN.';
    $('#back').hidden = false;
    $('#form').innerHTML = pinField('c','PIN actual') + pinField('p1','PIN nuevo') + pinField('p2','Repite el PIN nuevo') + '<button id="go">Cambiar PIN</button>';
    $('#go').onclick = async () => {
      const a=$('#p1').value, b=$('#p2').value;
      if (a.length<4) return err('Mínimo 4 caracteres.');
      if (a!==b) return err('Los PIN no coinciden.');
      try { await api('/api/auth/change',{current:$('#c').value, pin:a}); $('#err').style.color='var(--accent)'; err('PIN cambiado ✓'); }
      catch(e){ err(e.message); }
    };
  }
}
init();
</script>
</body>
</html>
